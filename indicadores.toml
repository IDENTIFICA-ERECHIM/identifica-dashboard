[[indicador]]
cod = "IND-005"
eixo = "Demografia"
tema = "Estrutura etária"
titulo = "Distribuição da população por grupos etários"
tabelas = ["populacao_idade_sexo_faixas", "populacao_idade_sexo_faixas_especifico"]
descricao = """
Pirâmide etária: homens à esquerda, mulheres à direita.

- **Censo 2022**: cobre somente 2022, mas possui faixas etárias mais específicas.
- **Série histórica**: cobre mais anos, mas possui menos especificação de idades.
"""
aviso = "Na série histórica as faixas a partir de 30 anos têm 10 anos de largura, por isso as barras dessas faixas parecem maiores."
fonte = "Tabela 9514 do SIDRA (Censo 2022) e séries de população por faixa etária e sexo do IPEA (série histórica)"



[[indicador]]
cod = "IND-006"
eixo = "Demografia"
tema = "Estrutura etária"
titulo = "Índice de envelhecimento"
tabelas = ["envelhecimento"]
descricao = """
Número de pessoas com **60 anos ou mais** para cada **100 pessoas de 0 a 14 anos**.
Acima da linha pontilhada, há mais idosos do que jovens.
"""
aviso = "Censo 2022."
fonte = "Tabela 10097 do SIDRA"



[[indicador]]
cod = "IND-007"
eixo = "Demografia"
tema = "Estrutura etária"
titulo = "Idade mediana"
tabelas = ["idade_mediana"]
descricao = """
A mediana é o valor que divide um conjunto de valores ao meio. Ou seja, metade da população é mais jovem, e a outra metade é mais velha.
"""
aviso = "Censo 2022."
fonte = "Tabela 9515 do SIDRA"



[[indicador]]
cod = "IND-008"
eixo = "Demografia"
tema = "Estrutura etária"
titulo = "Razão de dependência"
tabelas = ["razao_dependencia"]
descricao = '''
Compara quem tende a depender de outros para se sustentar (crianças e idosos) com quem tende a sustentar (a população em idade de trabalhar):
$$
\small \frac{\text{crianças (0-14)} + \text{idosos (60+)}}{\text{ativos (15-59)}} \times 100
$$
Quanto maior é a razão de dependência, maior a “carga” demográfica sobre a população em idade de trabalhar.
'''
aviso = ""
fonte = "Cálculo próprio com base nas séries de população por faixa etária do IPEA"



